services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - giftlink-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./giftlink-backend
    restart: unless-stopped
    environment:
      MONGO_URL: mongodb://mongodb:27017/giftdb
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the environment before starting Compose}
      PORT: 3060
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - "127.0.0.1:3060:3060"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3060/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  sentiment:
    build:
      context: ./sentiment
    restart: unless-stopped
    environment:
      PORT: 3000
      NODE_ENV: production
    ports:
      - "127.0.0.1:3001:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./giftlink-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  giftlink-mongo-data:
